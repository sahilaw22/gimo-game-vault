<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimo - Gaming Credentials Vault</title>
    
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="src/style.css">

    <!-- Inline Render-blocking Script to Prevent Light/Dark Mode Flashing -->
    <script>
        // Apply theme immediately to prevent flashing before page load
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        
        // Apply initial transition style using the requested default gif
        const defaultStyle = 'https://media.tenor.com/cyORI7kwShQAAAAi/shigure-ui-dance.gif';
        document.documentElement.setAttribute('data-transition-style', defaultStyle);
        document.documentElement.style.setProperty('--transition-mask', `url('${defaultStyle}')`);
    </script>

    <!-- External Defer-Loaded Controller Logic -->
    <script src="src/app.js" defer></script>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo-section">
                <div class="logo-icon">
                    <img src="assets/gimo-controller-icon.png" alt="Gimo Controller">
                </div>
                <div class="logo">Gi<span class="logo-accent">mo</span></div>
            </div>
            <div class="header-actions">
                <!-- Symmetrical theme switcher button -->
                <button id="themeSwitcher" class="btn btn-secondary theme-toggle-btn" aria-label="Toggle Dark Mode">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                    </svg>
                    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20">
                        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                    </svg>
                </button>
                
                <button class="btn btn-primary" onclick="openModal()">+ Add Credential</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <h1 class="page-title">Gaming Credentials <span id="credentialsCount" class="count-badge">0</span></h1>
        <p class="page-subtitle">Manage and organize all your gaming accounts in one secure place</p>

        <!-- Search -->
        <div class="search-section">
            <div class="search-wrapper">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Search games, accounts, or emails..."
                >
                <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" aria-label="Clear search">✕</button>
            </div>
        </div>

        <!-- Grid -->
        <div class="credentials-grid" id="credentialsGrid"></div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">🔍</div>
            <div class="empty-title">No games found</div>
            <p class="empty-text">Try adjusting your search or add a new credential to get started</p>
        </div>
    </main>

    <!-- Add/Edit Game Modal (wrapped in form for Enter-to-Submit support) -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()" aria-label="Close modal">✕</button>
            <h2 class="modal-title" id="modalTitle">Add New Game</h2>
            <p class="modal-subtitle" id="modalSubtitle">Create a new gaming credential entry</p>

            <form id="credentialForm" onsubmit="event.preventDefault(); addCredential();">
                <div class="form-group">
                    <label for="gameName">Game Name *</label>
                    <input type="text" id="gameName" placeholder="e.g., Elden Ring, GTA Online" required>
                </div>

                <div class="form-group">
                    <label>Platform Tags (Select Multiple)</label>
                    <div class="tag-selector-wrapper">
                        <button type="button" class="tag-select-btn" data-tag="steam" onclick="toggleTagSelection('steam')">

                            Steam
                        </button>
                        <button type="button" class="tag-select-btn" data-tag="epic" onclick="toggleTagSelection('epic')">

                            Epic Games
                        </button>
                        <button type="button" class="tag-select-btn" data-tag="ubisoft" onclick="toggleTagSelection('ubisoft')">
                            <svg class="tag-icon" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M23.561 11.988C23.301-.304 6.954-4.89.656 6.634c.282.206.661.477.943.672a11.747 11.747 0 00-.976 3.067 11.885 11.885 0 00-.184 2.071C.439 18.818 5.621 24 12.005 24c6.385 0 11.556-5.17 11.556-11.556v-.455zm-20.27 2.06c-.152 1.246-.054 1.636-.054 1.788l-.282.098c-.108-.206-.37-.932-.488-1.908C2.163 10.308 4.7 6.96 8.57 6.33c3.544-.52 6.937 1.68 7.728 4.758l-.282.098c-.087-.087-.228-.336-.77-.878-4.281-4.281-11.002-2.32-11.956 3.74zm11.002 2.081a3.145 3.145 0 01-2.59 1.355 3.15 3.15 0 01-3.155-3.155 3.159 3.159 0 012.927-3.144c1.018-.043 1.972.51 2.416 1.398a2.58 2.58 0 01-.455 2.95c.293.205.575.4.856.595zm6.58.12c-1.669 3.782-5.106 5.766-8.77 5.712-7.034-.347-9.083-8.466-4.38-11.393l.207.206c-.076.108-.358.325-.791 1.182-.51 1.041-.672 2.081-.607 2.732.369 5.67 8.314 6.83 11.045 1.214C21.057 8.217 11.822.401 3.626 6.374l-.184-.184C5.599 2.808 9.816 1.3 13.837 2.309c6.147 1.55 9.453 7.956 7.035 13.94z"/></svg>
                            Ubisoft
                        </button>
                        <button type="button" class="tag-select-btn" data-tag="xbox" onclick="toggleTagSelection('xbox')">
                            <svg class="tag-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M7.202 15.967a8 8 0 0 1-3.552-1.26c-.898-.585-1.101-.826-1.101-1.306 0-.965 1.062-2.656 2.879-4.583C6.459 7.723 7.897 6.44 8.052 6.475c.302.068 2.718 2.423 3.622 3.531 1.43 1.753 2.088 3.189 1.754 3.829-.254.486-1.83 1.437-2.987 1.802-.954.301-2.207.429-3.239.33m-5.866-3.57C.589 11.253.212 10.127.03 8.497c-.06-.539-.038-.846.137-1.95.218-1.377 1.002-2.97 1.945-3.95.401-.417.437-.427.926-.263.595.2 1.23.638 2.213 1.528l.574.519-.313.385C4.056 6.553 2.52 9.086 1.94 10.653c-.315.852-.442 1.707-.306 2.063.091.24.007.15-.3-.319Zm13.101.195c.074-.36-.019-1.02-.238-1.687-.473-1.443-2.055-4.128-3.508-5.953l-.457-.575.494-.454c.646-.593 1.095-.948 1.58-1.25.381-.237.927-.448 1.161-.448.145 0 .654.528 1.065 1.104a8.4 8.4 0 0 1 1.343 3.102c.153.728.166 2.286.024 3.012a9.5 9.5 0 0 1-.6 1.893c-.179.393-.624 1.156-.82 1.404-.1.128-.1.127-.043-.148ZM7.335 1.952c-.67-.34-1.704-.705-2.276-.803a4 4 0 0 0-.759-.043c-.471.024-.45 0 .306-.358A7.8 7.8 0 0 1 6.47.128c.8-.169 2.306-.17 3.094-.005.85.18 1.853.552 2.418.9l.168.103-.385-.02c-.766-.038-1.88.27-3.078.853-.361.176-.676.316-.699.312a12 12 0 0 1-.654-.319Z"/></svg>
                            Xbox
                        </button>
                        <button type="button" class="tag-select-btn" data-tag="rockstar" onclick="toggleTagSelection('rockstar')">

/path></svg>
                            Rockstar
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="gameAccount">Account ID / Username</label>
                    <input type="text" id="gameAccount" placeholder="Your account ID or username">
                </div>

                <div class="form-group">
                    <label for="gamePassword">Password</label>
                    <input type="text" id="gamePassword" placeholder="Your password">
                </div>

                <div class="form-group">
                    <label for="gameEmail">Email</label>
                    <input type="email" id="gameEmail" placeholder="Associated email">
                </div>

                <div class="form-group">
                    <label for="gameEmailPass">Email Password</label>
                    <input type="text" id="gameEmailPass" placeholder="Email password">
                </div>

                <div class="form-group">
                    <label for="gameExtra">Additional Info</label>
                    <input type="text" id="gameExtra" placeholder="Steam ID, Nickname, etc.">
                </div>

                <div class="form-actions">
                    <!-- Secondary button perfectly symmetrical to Primary button -->
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="submitBtn" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
